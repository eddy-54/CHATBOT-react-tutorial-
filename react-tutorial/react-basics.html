<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
      let pckofSocks = 10;
      let TShirt = 8;
      let shippingCost = 5;
      let productCost = pckofSocks + TShirt * 2;
      let totalCost = productCost + shippingCost;
      console.log(productCost);
      console.log(dayjs().format("MMMM D"));
      const time = setInterval(() => {
        root.render(dayjs().format("HH:mm:ss"));
      }, 1000);
      const div = (
        <div>
          <p>Today is {dayjs().format("MMMM D")}</p>
          <p>Current time is {dayjs().format("HH:mm:ss")}</p>
          <p>Welcome to Super Simple Dev</p>
          <button> Click Me</button>
          <p>Product cost: ${productCost}</p>
          <p>Shipping cost: ${shippingCost}</p>
          <p>Product cost: ${totalCost}</p>
          <button>Place Your order</button>
          <p>Clock:{time}</p>
          <p> {dayjs().format("MMMM D")} </p>
        </div>
      );

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      root.render(div);
    </script>
  </body>
</html>
