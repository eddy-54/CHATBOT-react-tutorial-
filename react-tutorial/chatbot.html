<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    <style>
      body {
        font-family: arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }
      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-message-user {
        display: flex;
        justify-content: flex-end;
        align-items: start;
      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel">
      // function LoginForm() {
      //   return (
      //     <>
      //       <form action="">
      //         <input placeholder="email" type="email" />
      //         <input placeholder="password" type="password" />
      //       </form>
      //       <button>login</button>
      //       <button>sign up</button>
      //     </>
      //   );
      // }
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);
        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (inputText == "") {
            // setIsLoading(true);
            return;
          }
          // setIsLoading("true")
          const newChatMessage = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              key: crypto.randomUUID(),
            },
            // {
            //   message: "loading..",
            //   sender: "robot",
            //   key: crypto.randomUUID(),
            // },
          ];
          setChatMessages(newChatMessage);
          setInputText("");
          // setChatMessages([
          //   ...chatMessages,
          //   { messsage: "loading..", sender: "robot", key: crypto.randomUUID },
          // ]);
          setChatMessages([
            ...newChatMessage,
            {
              message: "loading..",
              sender: "robot",
              key: crypto.randomUUID(),
            },
          ]);

          const response = await chatbot.getResponseAsync(inputText);

          setChatMessages([
            ...newChatMessage,

            {
              message: response,
              sender: "robot",
              key: crypto.randomUUID(),
            },
          ]);
          // setIsLoading("false")
        }
        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              className="chat-input"
            />
            <button
              className="send-button"
              onClick={sendMessage}
              disabled={isLoading}
            >
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        //   const {message, sender}=props
        // ______________________________________________________________
        //         if (sender === "robot") {
        //           return (
        //             <div>
        //               <img src="robot.png" width="50" />
        //               {message}
        //             </div>
        //           );
        //         } else {
        //           return (
        //             <div>
        //               {message}
        //               <img src="user.png" width="50" />
        //             </div>
        //           );
        //         }
        //____________________________________________________________________
        // return (
        //   <div>
        //     {sender === "robot" && <img src="robot.png" width="50" />}
        //     {message}
        //     <img src="user.png" width="50" />
        //   </div>)
        //_________________________________________________________________
        return (
          <div
            className={
              sender === "user" ? "chat-message-user" : "chat-message-robot"
            }
          >
            {sender === "robot" && (
              <img src="robot.png" className="chat-message-profile" />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && (
              <img src="user.png" className="chat-message-profile" />
            )}
          </div>
        );
      }

      function ChatMessagess({ chatMessages }) {
        const chatMessagesRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            container.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.key}
                />
              );
            })}
          </div>
        );
      }
      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          { message: "Hello chatbot", sender: "user", key: "id1" },
          {
            message: "Helloo, how can I help you",
            sender: "robot",
            key: "id2",
          },
          {
            message: "Can you get me today's date?", 
            sender: "user",
            key: "id3",
          },
        ]);
        return (
          <div className="app-container">
            <ChatMessagess
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
